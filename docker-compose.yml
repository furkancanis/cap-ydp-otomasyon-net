# Yerelde tek komutla (uygulama + PostgreSQL):  docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cap_yerel_sifre
      POSTGRES_DB: capdb
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://cap:cap_yerel_sifre@db:5432/capdb
      ASPNETCORE_ENVIRONMENT: Development
      TRUST_PROXY: "0"
    depends_on: [db]
volumes:
  pgdata:
